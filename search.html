
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/search.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <script src="./js/app.js" defer></script>

    <title>Поиск поездок — Попутно</title>
</head>

<body>
    <div class="glass-bg-sphere sphere-1"></div>
    <div class="glass-bg-sphere sphere-2"></div>
    <div class="glass-bg-sphere sphere-3"></div>

    <header>
        <div class="container">
            <div class="menu">
                <a href="index.html" class="logo">
                    <img src="./img/04_p_icon.svg" alt="Попутно">
                </a>

                <nav class="nav-menu">
                    <a href="index.html#steps">Как это работает</a>
                    <a href="index.html">Главная</a>
                    <button
                        type="button"
                        class="btn-primary"
                        id="open-ride-modal"
                    >
                        Предложить поездку
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <!-- Поиск по маршруту -->
        <section class="search-section">
            <div class="container">
                <div class="search-page-heading">
                    <h1 class="section-title">Найдите свою поездку</h1>
                    <p class="section-subtitle">
                        Выберите маршрут и подходящего водителя
                    </p>
                </div>

                <form class="search-form glass-element" id="search-form">
                    <div class="search-group">
                        <label for="from">Откуда</label>
                        <input
                            type="text"
                            id="from"
                            name="from"
                            placeholder="Город отправления"
                            minlength="2"
                            maxlength="60"
                        >
                    </div>

                    <div class="search-divider"></div>

                    <div class="search-group">
                        <label for="to">Куда</label>
                        <input
                            type="text"
                            id="to"
                            name="to"
                            placeholder="Город прибытия"
                            minlength="2"
                            maxlength="60"
                        >
                    </div>

                    <div class="search-divider"></div>

                    <div class="search-group">
                        <label for="date">Когда</label>
                        <input
                            type="date"
                            id="date"
                            name="date"
                        >
                    </div>

                    <div class="search-divider"></div>

                    <div class="search-group">
                        <label for="passengers">Пассажиры</label>
                        <input
                            type="number"
                            id="passengers"
                            name="seats"
                            min="1"
                            max="8"
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn-primary search-btn"
                    >
                        Найти
                    </button>
                </form>
            </div>
        </section>

        <!-- Фильтры и результаты -->
        <section class="main-search-section">
            <div class="container search-layout">

                <aside class="filter-block glass-element">
                    <h2 class="filter-title">Фильтры</h2>

                    <div class="filter-field">
                        <label for="search-query">
                            Водитель или маршрут
                        </label>
                        <input
                            type="search"
                            id="search-query"
                            placeholder="Например, Александр"
                        >
                    </div>

                    <div class="filter-field">
                        <label for="category-filter">
                            Количество свободных мест
                        </label>
                        <select id="category-filter">
                            <option value="all">Все категории</option>
                            <option value="one">1 место</option>
                            <option value="two">2 места</option>
                            <option value="three-plus">3 и более мест</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="max-price">Цена за место, до ₽</label>
                        <input
                            type="number"
                            id="max-price"
                            min="0"
                            step="50"
                            placeholder="Без ограничения"
                        >
                    </div>

                    <div class="filter-field">
                        <label for="min-rating">Рейтинг водителя</label>
                        <select id="min-rating">
                            <option value="0">Любой рейтинг</option>
                            <option value="4">От 4.0</option>
                            <option value="4.5">От 4.5</option>
                            <option value="5">Только 5.0</option>
                        </select>
                    </div>

                    <button
                        type="button"
                        class="btn-secondary reset-filters"
                        id="reset-filters"
                    >
                        Сбросить фильтры
                    </button>
                </aside>

                <div class="routes-block">
                    <div class="sort-block glass-element">
                        <div class="results-heading">
                            <h2 class="section-title">Найденные поездки</h2>
                            <p id="results-count" aria-live="polite">
                                Загружаем поездки...
                            </p>
                        </div>

                        <div class="sort-control">
                            <label for="sort-by">Сортировка:</label>
                            <select id="sort-by" class="sort-by">
                                <option value="date-asc">
                                    Сначала ближайшие
                                </option>
                                <option value="date-desc">
                                    Сначала поздние
                                </option>
                                <option value="price-asc">
                                    Сначала дешевле
                                </option>
                                <option value="price-desc">
                                    Сначала дороже
                                </option>
                            </select>
                        </div>
                    </div>

                    <div
                        class="routes"
                        id="routes"
                        aria-live="polite"
                    >
                        <!-- Карточки создаются -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Модальное окно создания поездки -->
    <div
        class="modal-backdrop"
        id="ride-modal"
        hidden
    >
        <section
            class="ride-modal glass-element"
            role="dialog"
            aria-modal="true"
            aria-labelledby="ride-modal-title"
        >
            <div class="modal-header">
                <h2 id="ride-modal-title">Предложить поездку</h2>

                <button
                    type="button"
                    class="modal-close"
                    data-close-modal
                    aria-label="Закрыть окно"
                >
                    ×
                </button>
            </div>

            <p class="modal-description">
                Заполните информацию о маршруте и стоимости поездки.
            </p>

            <form id="ride-form" novalidate>
                <div class="ride-form-grid">

                    <div class="form-field">
                        <label for="ride-from">Откуда</label>
                        <input
                            type="text"
                            id="ride-from"
                            minlength="2"
                            maxlength="60"
                            required
                            placeholder="Город отправления"
                        >
                        <small class="field-error" data-error-for="ride-from"></small>
                    </div>

                    <div class="form-field">
                        <label for="ride-to">Куда</label>
                        <input
                            type="text"
                            id="ride-to"
                            minlength="2"
                            maxlength="60"
                            required
                            placeholder="Город прибытия"
                        >
                        <small class="field-error" data-error-for="ride-to"></small>
                    </div>

                    <div class="form-field">
                        <label for="ride-date">Дата отправления</label>
                        <input
                            type="date"
                            id="ride-date"
                            required
                        >
                        <small class="field-error" data-error-for="ride-date"></small>
                    </div>

                    <div class="form-field">
                        <label for="ride-time">Время отправления</label>
                        <input
                            type="time"
                            id="ride-time"
                            required
                        >
                        <small class="field-error" data-error-for="ride-time"></small>
                    </div>

                    <div class="form-field">
                        <label for="ride-price">Цена за место, ₽</label>
                        <input
                            type="number"
                            id="ride-price"
                            min="0"
                            max="1000000"
                            step="1"
                            required
                            placeholder="650"
                        >
                        <small class="field-error" data-error-for="ride-price"></small>
                    </div>

                    <div class="form-field">
                        <label for="ride-seats">Свободные места</label>
                        <input
                            type="number"
                            id="ride-seats"
                            min="1"
                            max="8"
                            step="1"
                            required
                            value="3"
                        >
                        <small class="field-error" data-error-for="ride-seats"></small>
                    </div>

                    <div class="form-field form-field-full">
                        <label for="ride-driver">Имя водителя</label>
                        <input
                            type="text"
                            id="ride-driver"
                            minlength="2"
                            maxlength="60"
                            required
                            placeholder="Ваше имя"
                        >
                        <small class="field-error" data-error-for="ride-driver"></small>
                    </div>
                </div>

                <p
                    class="form-submit-error"
                    id="ride-form-error"
                    role="alert"
                ></p>

                <div class="modal-actions">
                    <button
                        type="button"
                        class="btn-secondary"
                        data-close-modal
                    >
                        Отмена
                    </button>

                    <button type="submit" class="btn-primary">
                        Создать поездку
                    </button>
                </div>
            </form>
        </section>
    </div>

    <footer class="footer glass-element">
        <div class="container footer-inner">
            <div>Попутно © 2026. Демонстрационный сайт.</div>

            <div class="footer-links">
                <a href="index.html#steps">Как это работает</a>
                <a href="index.html">Главная</a>
                <a href="#">Поддержка</a>
            </div>
        </div>
    </footer>
</body>
</html>
