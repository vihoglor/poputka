<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предложить поездку — Попутка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/pages.css?v=5">
    <script src="./js/config.js?v=5" defer></script>
    <script src="./js/app.js?v=5" defer></script>
</head>
<body>
    <div class="glass-bg-sphere sphere-1"></div>
    <div class="glass-bg-sphere sphere-2"></div>
    <div class="glass-bg-sphere sphere-3"></div>
    <header>
        <div class="container">
            <div class="menu">
                <a class="logo" href="./index.html"><img src="./img/04_p_icon.svg" alt="Попутка"></a>
                <nav class="nav-menu" aria-label="Основная навигация">
                    <a href="./index.html">Главная</a>
                    <a href="./search.html">Найти поездку</a>
                    <a data-auth-link href="./auth.html?next=account.html">Личный кабинет</a>
                    <a class="btn-primary btn-header" href="./create-trip.html">Предложить поездку</a>
                </nav>
            </div>
        </div>
    </header>
    <main class="interior-main">
        <div class="container">
            <div class="global-error" id="page-error" role="alert"></div>
            <div class="page-heading"><div><div class="eyebrow">ДЛЯ ВОДИТЕЛЕЙ</div><h1 class="section-title" id="create-trip-title">Новая поездка</h1><p class="muted">Проверьте маршрут, укажите детали и опубликуйте объявление</p></div><a href="./account.html" class="subtle-link">← Личный кабинет</a></div>
<div class="editor-layout"><form class="editor-panel glass-element" id="create-trip-form" novalidate>
    <h2>Маршрут и время</h2><div class="ride-form-grid">
        <div class="form-field"><label for="editor-from">Откуда</label><input id="editor-from" name="from_city" type="text" required minlength="2" maxlength="60" placeholder="Город отправления"><small class="field-error" data-error-for="editor-from"></small></div>
        <div class="form-field"><label for="editor-to">Куда</label><input id="editor-to" name="to_city" type="text" required minlength="2" maxlength="60" placeholder="Город прибытия"><small class="field-error" data-error-for="editor-to"></small></div>
        <div class="form-field"><label for="editor-date">Дата отправления</label><input id="editor-date" name="departure_date" type="date" required><small class="field-error" data-error-for="editor-date"></small></div>
        <div class="form-field"><label for="editor-time">Время отправления</label><input id="editor-time" name="departure_time" type="time" required><small class="field-error" data-error-for="editor-time"></small></div>
        <div class="form-field"><label for="editor-price">Цена за место, ₽</label><input id="editor-price" name="price" type="number" required min="0" max="1000000" step="1" placeholder="650"><small class="field-error" data-error-for="editor-price"></small></div>
        <div class="form-field"><label for="editor-seats">Количество мест</label><input id="editor-seats" name="seats_total" type="number" required min="1" max="8" step="1" value="3"><small class="field-error" data-error-for="editor-seats"></small></div>
        <div class="form-field form-field-full"><label for="editor-description">Дополнительная информация</label><textarea id="editor-description" name="description" maxlength="1000" rows="4" placeholder="Место встречи, багаж, пожелания..." ></textarea><small class="field-error" data-error-for="editor-description"></small></div>
    </div><p id="create-trip-error" class="form-submit-error" role="alert"></p><div class="editor-actions"><a class="btn-secondary action-link" href="./account.html">Отмена</a><button class="btn-primary" type="submit">Опубликовать поездку</button></div>
</form></div>
        </div>
    </main>
    <footer class="footer glass-element"><div class="container footer-inner"><span>Попутка © 2026</span><div class="footer-links"><a href="./index.html">Главная</a><a href="./search.html">Найти поездку</a></div></div></footer>
</body>
</html>
